name: Deploy pagin estatica en pages

on:
  push:
      branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
   group: "pages"
   cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    #revision de codigo y lectura
      - name: Checkout
        uses: actions/checkout@v6

        #preparacion de github pages

      - name: Setup Pages
        uses: actions/configure-pages@v5
        #carga de archivos a github pages
      - name: Carga artifact 
        uses: actions/upload-pages-artifact@v4
        with:
           path: "."

      - name: Desplegar to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        